  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<line x1=\"0\" y1=\"205\" x2=\"1200\" y2=\"205\"><\u002Fline>\n          <\u002Fg>\n          <path class=\"momentum-path\" d=\"M0 545 C130 545 155 484 258 470 S392 446 452 386 S577 405 647 318 S783 315 844 226 S986 232 1088 108\"><\u002Fpath>\n          <circle class=\"momentum-point\" cx=\"258\" cy=\"470\" r=\"8\"><\u002Fcircle>\n          <circle class=\"momentum-point\" cx=\"452\" cy=\"386\" r=\"8\"><\u002Fcircle>\n          <circle class=\"momentum-point\" cx=\"647\" cy=\"318\" r=\"8\"><\u002Fcircle>\n          <circle class=\"momentum-point\" cx=\"844\" cy=\"226\" r=\"8\"><\u002Fcircle>\n          <path class=\"momentum-arrow\" d=\"M1048 112 1091 105 1084 149\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"shell hero-grid\">\n        <div>\n          <p class=\"eyebrow\">Boost Line · кредитный консалтинг<\u002Fp>\n          <h1>Постоянные отказы из-за низкого рейтинга? <span class=\"hero-solution\">Мы исправим!<\u002Fspan><\u002Fh1>\n          <p class=\"hero-copy\">Разберём кредитные отчёты, найдём спорные и неточные записи и составим понятную стратегию восстановления — без сложных терминов и хаотичных действий.<\u002Fp>\n          <div class=\"hero-actions\">\n            <a class=\"button button-primary\" href=\"#apply\">Получить разбор ситуации<\u002Fa>\n            <a class=\"button button-ghost\" href=\"#process\">Как проходит работа<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <aside class=\"signal\" aria-label=\"Пример персонального разбора\">\n          <div class=\"signal-label\"><span>Персональный разбор<\u002Fspan><span class=\"signal-dot\"><\u002Fspan><\u002Fdiv>\n          <div class=\"score-ring\" id=\"scoreRing\" aria-hidden=\"true\"><svg viewBox=\"0 0 200 200\" id=\"ringSvg\"><\u002Fsvg><div class=\"score-copy\"><strong id=\"stageNum\">3 шага<\u002Fstrong><span id=\"stageLbl\">к результату<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          \n          <div class=\"signal-rows\">\n            <div class=\"signal-row off\"><span class=\"signal-check\">✓<\u002Fspan><span>Проверка трех бюро<\u002Fspan><em>REVIEW<\u002Fem><\u002Fdiv>\n            <div class=\"signal-row off\"><span class=\"signal-check\">✓<\u002Fspan><span>Цели и составление плана<\u002Fspan><em>PLAN<\u002Fem><\u002Fdiv>\n            <div class=\"signal-row off\"><span class=\"signal-check\">✓<\u002Fspan><span>Сопровождение до результата<\u002Fspan><em>ACTION<\u002Fem><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"problems\">\n      <div class=\"shell\">\n        <div class=\"section-head\">\n          <h2>Что может тянуть кредитную историю вниз<\u002Fh2>\n          <p>Сначала мы проверяем, как информация отражена в отчётах, чем она подтверждается и какие шаги имеют основания.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"issues\">\n          <article class=\"issue\"><span class=\"issue-num\">01<\u002Fspan><h3>Collections<\u002Fh3><p>Проверяем данные о долге, владельце счета, сумме и датах.<\u002Fp><\u002Farticle>\n          <article class=\"issue\"><span class=\"issue-num\">02<\u002Fspan><h3>Late payments<\u002Fh3><p>Сверяем историю платежей и ищем ошибки в отчетности.<\u002Fp><\u002Farticle>\n          <article class=\"issue\"><span class=\"issue-num\">03<\u002Fspan><h3>Charge-off<\u002Fh3><p>Разбираем статус счета и соответствие информации документам.<\u002Fp><\u002Farticle>\n          <article class=\"issue\"><span class=\"issue-num\">04<\u002Fspan><h3>Hard inquiries<\u002Fh3><p>Проверяем, были ли запросы авторизованы и корректно отражены.<\u002Fp><\u002Farticle>\n          <article class=\"issue\"><span class=\"issue-num\">05<\u002Fspan><h3>Несоответствия персональной информации<\u002Fh3><p>Ищем расхождения в имени, адресах и других персональных данных.<\u002Fp><\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <aside class=\"credit-check\" aria-labelledby=\"credit-check-title\">\n      <div class=\"shell\">\n        <div class=\"credit-check-card\">\n          <div class=\"credit-check-copy\">\n            <div class=\"partner-badge\" aria-label=\"Официальный партнёр Smart Credit\">\n              <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3 20 6v5c0 5.2-3.4 8.4-8 10-4.6-1.6-8-4.8-8-10V6l8-3Z\"><\u002Fpath><path d=\"m8.5 12 2.2 2.2 4.8-5\"><\u002Fpath><\u002Fsvg>\n              Официальный партнёр Smart Credit\n            <\u002Fdiv>\n            <h2 id=\"credit-check-title\">Проверьте кредитную историю за $1<\u002Fh2>\n            <p>Получите доступ к своим кредитным отчётам перед консультацией — так разбор будет предметным с первого разговора.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"credit-check-action\">\n            <a class=\"button button-primary\" href=\"https://www.smartcredit.com/join/?pid=42039\" target=\"_blank\" rel=\"noopener sponsored\">Проверить кредитную историю за $1 →<\u002Fa>\n            <span class=\"credit-check-note\">Партнёрская ссылка Boost Line · условия сервиса — на сайте SmartCredit<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <section class=\"cost-example\" id=\"cost-example\" aria-labelledby=\"cost-title\">\n      <div class=\"shell\">\n        <div class=\"cost-panel\">\n          <div class=\"cost-head\">\n            <h2 id=\"cost-title\">Сколько стоит вам низкий кредитный скор<\u002Fh2>\n            <p>Один и тот же заём может обойтись заметно дороже. Ниже — два простых расчётных примера для скора 600 и восстановленного скора 700.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"cost-grid\">\n            <article class=\"cost-card\">\n              <div class=\"cost-card-head\"><h3>Ипотека<\u002Fh3><span>$300,000<br>на 30 лет<\u002Fspan><\u002Fdiv>\n              <div class=\"cost-scenarios\">\n                <div class=\"cost-scenario\"><small>Низкий скор · 600<\u002Fsmall><strong>≈ $530,427<\u002Fstrong><span>переплата при условной ставке 8.5%<\u002Fspan><\u002Fdiv>\n                <div class=\"cost-scenario better\"><small>Восстановленный · 700<\u002Fsmall><strong>≈ $382,633<\u002Fstrong><span>переплата при условной ставке 6.5%<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <p class=\"cost-loss\"><span>Потеря на процентах<\u002Fspan><strong>≈ $147,793<\u002Fstrong><\u002Fp>\n            <\u002Farticle>\n            <article class=\"cost-card\">\n              <div class=\"cost-card-head\"><h3>Автокредит<\u002Fh3><span>$30,000<br>на 72 месяца<\u002Fspan><\u002Fdiv>\n              <div class=\"cost-scenarios\">\n                <div class=\"cost-scenario\"><small>Низкий скор · 600<\u002Fsmall><strong>≈ $18,052<\u002Fstrong><span>переплата при условной ставке 17%<\u002Fspan><\u002Fdiv>\n                <div class=\"cost-scenario better\"><small>Восстановленный · 700<\u002Fsmall><strong>≈ $6,826<\u002Fstrong><span>переплата при условной ставке 7%<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <p class=\"cost-loss\"><span>Потеря на процентах<\u002Fspan><strong>≈ $11,226<\u002Fstrong><\u002Fp>\n            <\u002Farticle>\n          <\u002Fdiv>\n          <div class=\"cost-foot\">\n            <p class=\"cost-note\">Это иллюстративный расчёт с условными ставками, без первоначального взноса, комиссий, налогов и страховки. Реальные условия зависят не только от кредитного скора, но и от дохода, долга, кредитора, рынка и других факторов. Пример не является предложением кредита или гарантией ставки.<\u002Fp>\n            <a class=\"button button-primary\" href=\"#apply\">Получить бесплатную консультацию<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"process\" id=\"process\">\n      <div class=\"shell\">\n        <div class=\"section-head\">\n          <h2>По полочкам: от отчёта до действий и результата<\u002Fh2>\n          <p>Без перегруза. На каждом этапе вы понимаете, что мы проверяем, что можно сделать и чего ожидать дальше.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"steps\">\n          <article class=\"step\">\n            <div class=\"step-top\"><span class=\"step-num\">ШАГ 01<\u002Fspan><span class=\"step-icon\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fdiv>\n            <h3>Диагностика<\u002Fh3>\n            <p>Знакомимся с вашей целью и изучаем кредитные отчеты из основных бюро.<\u002Fp>\n          <\u002Farticle>\n          <article class=\"step\">\n            <div class=\"step-top\"><span class=\"step-num\">ШАГ 02<\u002Fspan><span class=\"step-icon\" aria-hidden=\"true\">≡<\u002Fspan><\u002Fdiv>\n            <h3>Персональный план<\u002Fh3>\n            <p>Определяем приоритеты: какие записи проверить, какие документы собрать и что улучшать в первую очередь.<\u002Fp>\n          <\u002Farticle>\n          <article class=\"step\">\n            <div class=\"step-top\"><span class=\"step-num\">ШАГ 03<\u002Fspan><span class=\"step-icon\" aria-hidden=\"true\">✓<\u002Fspan><\u002Fdiv>\n            <h3>Сопровождение<\u002Fh3>\n            <p>Помогаем пройти процесс последовательно, отслеживать ответы и корректировать дальнейшие шаги до результата.<\u002Fp>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"why\" id=\"why\">\n      <div class=\"shell\">\n        <div class=\"section-head\">\n          <h2>Почему выбирают нас<\u002Fh2>\n          <p>Опыт, персональная стратегия и ответственность за работу, зафиксированная в договоре.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"why-grid\">\n          <article class=\"why-item\"><span class=\"why-value\">700+<\u002Fspan><h3>Успешных кейсов<\u002Fh3><p>Практический опыт с разными ситуациями в кредитных отчётах.<\u002Fp><\u002Farticle>\n          <article class=\"why-item\"><span class=\"why-value\">100+<\u002Fspan><h3>Пунктов в среднем<\u002Fh3><p>В среднем на столько вырастает кредитный рейтинг клиентов по данным Boost Line.<\u002Fp><\u002Farticle>\n          <article class=\"why-item\"><span class=\"why-value\">1:1<\u002Fspan><h3>Персональный план<\u002Fh3><p>Индивидуальная стратегия для каждого клиента, его отчётов и целей.<\u002Fp><\u002Farticle>\n          <article class=\"why-item\"><span class=\"why-value\">100%<\u002Fspan><h3>Конфиденциальность и ответственность<\u002Fh3><p>Бережно относимся к вашим данным и отвечаем за свою работу по договору.<\u002Fp><\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <div class=\"shell principles\">\n        <div>\n          <h2>Либо мы делаем свою работу по договору, либо возвращаем деньги.<\u002Fh2>\n          <p>До старта фиксируем объём и этапы работы. Если Boost Line не выполнит свою часть договора, мы вернём деньги.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"principle-list\">\n          <div class=\"principle\"><b>1<\u002Fb><div><strong>Фиксируем объём работы<\u002Fstrong><span>Вы заранее знаете, какие этапы входят в договор.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"principle\"><b>2<\u002Fb><div><strong>Объясняем каждый шаг<\u002Fstrong><span>Вы понимаете, что мы делаем, на каком этапе и зачем.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"principle\"><b>3<\u002Fb><div><strong>Отвечаем за свою часть<\u002Fstrong><span>Гарантия охватывает выполнение всех этапов работы, закреплённых в договоре.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"reviews\" id=\"reviews\" aria-labelledby=\"reviews-title\">\n      <div class=\"shell\">\n        <div class=\"section-head\">\n          <h2 id=\"reviews-title\">Отзывы клиентов<\u002Fh2>\n          <p>Каждая карточка готова для реального отзыва — имя и текст появятся только после согласия клиента.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"reviews-frame\" id=\"reviewsFrame\" role=\"region\" aria-roledescription=\"карусель\" aria-label=\"Шаблоны отзывов клиентов\">\n          <div class=\"reviews-track\" id=\"reviewsTrack\">\n            <article class=\"review-card\" aria-label=\"Шаблон отзыва 1 из 10\"><div class=\"review-card-top\"><span class=\"review-template\">Шаблон отзыва<\u002Fspan><span class=\"review-number\">01 / 10<\u002Fspan><\u002Fdiv><h3>Место для имени клиента<\u002Fh3><p>Сюда вставляется настоящий отзыв клиента о его опыте работы с Boost Line.<\u002Fp><div class=\"review-permission\">Публикация после согласия клиента<\u002Fdiv><\u002Farticle>\n            <article class=\"review-card\" aria-label=\"Шаблон отзыва 2 из 10\"><div class=\"review-card-top\"><span class=\"review-template\">Шаблон отзыва<\u002Fspan><span class=\"review-number\">02 / 10<\u002Fspan><\u002Fdiv><h3>Место для имени клиента<\u002Fh3><p>Сюда вставляется настоящий отзыв клиента о его опыте работы с Boost Line.<\u002Fp><div class=\"review-permission\">Публикация после согласия клиента<\u002Fdiv><\u002Farticle>\n            <article class=\"review-card\" aria-label=\"Шаблон отзыва 3 из 10\"><div class=\"review-card-top\"><span class=\"review-template\">Шаблон отзыва<\u002Fspan><span class=\"review-number\">03 / 10<\u002Fspan><\u002Fdiv><h3>Место для имени клиента<\u002Fh3><p>Сюда вставляется настоящий отзыв клиента о его опыте работы с Boost Line.<\u002Fp><div class=\"review-permission\">Публикация после согласия клиента<\u002Fdiv><\u002Farticle>\n            <article class=\"review-card\" aria-label=\"Шаблон отзыва 4 из 10\"><div class=\"review-card-top\"><span class=\"review-template\">Шаблон отзыва<\u002Fspan><span class=\"review-number\">04 / 10<\u002Fspan><\u002Fdiv><h3>Место для имени клиента<\u002Fh3><p>Сюда вставляется настоящий отзыв клиента о его опыте работы с Boost Line.<\u002Fp><div class=\"review-permission\">Публикация после согласия клиента<\u002Fdiv><\u002Farticle>\n            <article class=\"review-card\" aria-label=\"Шаблон отзыва 5 из 10\"><div class=\"review-card-top\"><span class=\"r faq-q\" type=\"button\" aria-expanded=\"false\"><span>На что распространяется гарантия?<\u002Fspan><span>+<\u002Fspan><\u002Fbutton>\n            <div class=\"faq-a\"><div><p>На выполнение всех этапов работы, закреплённых за Boost Line в договоре. Если мы не выполним свою часть, вернём деньги.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"faq-item\">\n            <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>Что нужно для первого разговора?<\u002Fspan><span>+<\u002Fspan><\u002Fbutton>\n            <div class=\"faq-a\"><div><p>Кратко опишите ситуацию, вашу цель и оставьте удобный номер телефона для связи.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n\n  <a class=\"mobile-cta\" href=\"#apply\">Оставить заявку<\u002Fa>\n  <a class=\"whatsapp-float\" href=\"https://wa.me/15619285780\" target=\"_blank\" rel=\"noopener\" aria-label=\"Написать Boost Line в WhatsApp\">\n    <svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M16.04 3.2A12.74 12.74 0 0 0 5.12 22.5L3.2 28.8l6.46-1.86a12.8 12.8 0 1 0 6.38-23.74Zm0 23.44a10.6 10.6 0 0 1-5.4-1.48l-.38-.22-3.83 1.1 1.02-3.73-.25-.39a10.63 10.63 0 1 1 8.84 4.72Zm5.83-7.95c-.32-.16-1.89-.93-2.18-1.04-.29-.1-.5-.16-.71.16-.21.32-.82 1.04-1 1.25-.19.21-.37.24-.69.08-.32-.16-1.34-.49-2.56-1.58a9.6 9.6 0 0 1-1.77-2.2c-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.1-.21.05-.4-.03-.56-.08-.16-.71-1.72-.98-2.36-.26-.62-.52-.54-.71-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.11 1.09-1.11 2.65s1.14 3.07 1.3 3.28c.16.21 2.24 3.42 5.43 4.8.76.33 1.35.52 1.81.67.76.24 1.46.21 2 .13.61-.09 1.89-.77 2.16-1.51.27-.74.27-1.38.19-1.51-.08-.13-.29-.21-.61-.37Z\"><\u002Fpath><\u002Fsvg>\n  <\u002Fa>\n\n  <script>\n    (function(){\n      var items=document.querySelectorAll('.faq-item');\n      items.forEach(function(item){\n        var btn=item.querySelector('.faq-q');\n        btn.addEven ong>Отметьте согласие на обработку данных, чтобы сформировать заявку.');\n          consent.focus();\n          return;\n        }\n        var fullPhone='+1 '+formatPhone(digits);\n        draft='Заявка на консультацию Boost Line\\nИмя: '+firstName+'\\nТелефон: '+fullPhone+'\\nПроблема: '+(selected.length?selected.join(', '):'нужна первичная диагностика')+'\\nСогласие на обработку данных: подтверждено';\n        renderStatus('<strong>Черновик заявки готов.<\u002Fstrong>Скопируйте или скачайте его, чтобы передать консультанту.<div class=\"status-actions\"><button class=\"mini-btn\" type=\"button\" id=\"copyDraft\">Скопировать<\u002Fbutton><button class=\"mini-btn\" type=\"button\" id=\"downloadDraft\">Скачать .txt<\u002Fbutton><\u002Fdiv>');\n        document.getElementById('copyDraft').addEventListener('click',function(){\n          navigator.clipboard.writeText(draft).then(function(){ document.getElementById('copyDraft').textContent='Скопировано'; }).catch(function(){ document.getElementById('copyDraft').textContent='Не удалось скопировать'; });\n        });\n        document.getElementById('downloadDraft').addEventListener('click',function(){\n          var blob=new Blob([draft],{type:'text/plain;charset=utf-8'});\n          var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='boost-line-request.txt'; a.click();\n          setTimeout(function(){URL.revokeObjectURL(a.href);},1000);\n        });\n      });\n    })();\n  <\u002Fscript>\n\n  <script>\n    (function(){\n      var svg=document.getElementById('ringSvg'),ticks=[],NS='http://www.w3.org/2000/svg';\n      for(var s=0;s<3;s++)for(var i=0;i<12;i++){\n        var r=document.createElementNS(NS,'rect');\n        r.setAttribute('x',-4.5);r.setAttribute('y',-96);r.setAttribute('width',9);r.setAttribute('height',24);r.setAttribute('rx',2);\n        r.setAttribute('transform','translate(100 100) rotate('+(s*120+i*9.6+6)+')');\n        r.setAttribute('class','tick');svg.appendChild(r);ticks.push(r);\n      }\n      var rows=document.querySelectorAll('.signal-row'),num=document.getElementById('stageNum'),lbl=document.getElementById('stageLbl');\n      var names=['Диагностика','Персональный план','Сопровождение'],timers=[];\n      var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      function later(f,t){timers.push(setTimeout(f,t));}\n      function reset(){ticks.forEach(function(t){t.classList.remove('on');});rows.forEach(function(r){r.classList.add('off');});num.textContent='0 / 3';lbl.textContent='старт';}\n      function cycle(){\n        reset();\n        for(var s=0;s<3;s++)(function(s){\n          var t0=1800+s*2600;\n          for(var i=0;i<12;i++)(function(i){later(function(){ticks[s*12+i].classList.add('on');},t0+i*75);})(i);\n          later(function(){rows[s].classList.remove('off');num.textContent=(s+1)+' / 3';lbl.textContent=names[s];},t0+900);\n        })(s);\n        later(function(){num.textContent='3 шага';lbl.textContent='к результату';},1800+2*2600+2200);\n        later(cycle,1800+3*2600+2600);\n      }\n      if(still){ticks.forEach(function(t){t.classList.add('on');});rows.forEach(function(r){r.classList.remove('off');});}\n      else cycle();\n    })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
